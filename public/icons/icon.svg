<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Emerald Border Glow -->
    <linearGradient id="glow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <!-- Top Plate Gradient -->
    <linearGradient id="gsl-top" x1="6" y1="12" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Middle Plate Gradient -->
    <linearGradient id="gsl-mid" x1="6" y1="20" x2="42" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.75" />
    </linearGradient>

    <!-- Bottom Plate Gradient -->
    <linearGradient id="gsl-bot" x1="6" y1="28" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="gsl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="512" height="512" rx="112.64" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="510" height="510" rx="112.64" fill="none" stroke="url(#glow-border)" stroke-width="7.68" />

  <!-- Isometric Logo Content Scaled to Center -->
  <g transform="translate(51.2, 51.2) scale(8.533333333333333)">
    <!-- Bottom Layer: DEM Surface -->
    <g opacity="0.7">
      <polygon
        points="24,31 42,21 24,14 6,21"
        transform="translate(0, 12)"
        fill="url(#gsl-bot)"
        stroke="#10b981"
        stroke-width="1.2"
        stroke-linejoin="round"
      />
      <path
        d="M12 36 C18 33, 30 39, 36 33"
        stroke="#34d399"
        stroke-width="0.8"
        stroke-opacity="0.5"
        fill="none"
      />
    </g>

    <!-- Middle Layer: Grid / Infrastructure -->
    <g opacity="0.88">
      <polygon
        points="24,31 42,21 24,14 6,21"
        transform="translate(0, 6)"
        fill="url(#gsl-mid)"
        stroke="#38bdf8"
        stroke-width="1.3"
        stroke-linejoin="round"
      />
      <line x1="15" y1="24" x2="33" y2="30" stroke="#bae6fd" stroke-width="0.9" stroke-dasharray="1.5 2" />
      <line x1="33" y1="24" x2="15" y2="30" stroke="#bae6fd" stroke-width="0.9" stroke-dasharray="1.5 2" />
    </g>

    <!-- Vertical Guide Beams -->
    <line x1="6" y1="15" x2="6" y2="33" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 2" />
    <line x1="42" y1="15" x2="42" y2="33" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 2" />
    <line x1="24" y1="8" x2="24" y2="26" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.5" stroke-dasharray="1 2" />

    <!-- Top Layer: Remote Sensing Band -->
    <polygon
      points="24,25 42,15 24,8 6,15"
      fill="url(#gsl-top)"
      stroke="#ffffff"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Aperture -->
    <polygon
      points="24,19 33,14 24,10.5 15,14"
      fill="#ffffff"
      fill-opacity="0.3"
      stroke="#ffffff"
      stroke-width="1.1"
      stroke-linejoin="round"
    />

    <!-- Satellite Focal Pin -->
    <circle cx="24" cy="14" r="2.8" fill="#facc15" filter="url(#gsl-glow)" />
    <circle cx="24" cy="14" r="1.3" fill="#ffffff" />
  </g>
</svg>